# Builds gitty and gitty-up, the instance's shared context, for every supported
# platform and publishes the binaries, with a SHA256SUMS checksum file, to a
# GitHub Release.
# The two are built from the same tag and published together, so the pair a
# user downloads always agrees on the formats they exchange.
#
# Runs for both ways a release gets made:
#   - pushing a version tag (v1.2.3 or bare 1.2.3), which creates the release
#   - publishing a GitHub Release (including one created from an existing tag
#     or promoted from a draft), which uploads to it
# Publishing is idempotent, so a tag push followed by a release publish for the
# same version updates one release rather than failing or duplicating it.
name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  release:
    types: [published]

permissions:
  contents: write

# Both triggers can fire for the same version. Queue rather than cancel, so the
# second run re-uploads onto the release the first one created instead of
# leaving a half-published release behind.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Tags do not run the push/pull_request CI workflow, so the release gates
  # itself: no binary is published from a tree that fails these checks.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race -short ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          # Full history so --generate-notes can diff against the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.release.tag_name || github.ref_name }}"
          if [ -z "$version" ]; then
            echo "could not determine the release version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="gitty_${VERSION}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            echo "Building ${output}${ext}"
            # -X main.version stamps the tag into the binary so `gitty version`
            # reports it; without it every release would report "dev".
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${output}${ext}" .

            # gitty-up: a separate binary, never required by gitty, stamped
            # with the same version.
            plugin="gitty-up_${VERSION}_${os}_${arch}"
            echo "Building ${plugin}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION}" \
                -o "dist/${plugin}${ext}" ./cmd/gitty-up
          done

      - name: Smoke test the built binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="dist/gitty_${VERSION}_linux_amd64"
          got="$("$binary" version)"
          echo "gitty version -> $got"
          if [ "$got" != "$VERSION" ]; then
            echo "version mismatch: binary reports '$got', expected '$VERSION'"
            echo "(the -X main.version ldflag did not take effect)"
            exit 1
          fi
          # The binary must also be able to do its job, not just report a version.
          "$binary" completion bash > /dev/null

          # The plugin, installed the way the README says: renamed, next to
          # gitty. `gitty up` must find it there and run it.
          installed="$(mktemp -d)"
          cp "$binary" "$installed/gitty"
          cp "dist/gitty-up_${VERSION}_linux_amd64" "$installed/gitty-up"
          got="$("$installed/gitty" up --version)"
          echo "gitty up --version -> $got"
          if [ "$got" != "$VERSION" ]; then
            echo "plugin version mismatch: 'gitty up --version' reports '$got', expected '$VERSION'"
            exit 1
          fi
          echo "smoke test passed"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gitty_* gitty-up_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION exists; uploading assets"
            gh release upload "$VERSION" dist/gitty_* dist/gitty-up_* dist/SHA256SUMS --clobber
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              dist/gitty_* dist/gitty-up_* dist/SHA256SUMS
          fi
