# Builds gitty for multiple platforms and publishes a GitHub Release with the
# binaries and a SHA256SUMS checksum file whenever a version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.4"

      - name: Download dependencies
        run: go mod download

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )
          for platform in "${platforms[@]}"; do
            os="${platform%/*}"
            arch="${platform#*/}"
            output="gitty_${VERSION}_${os}_${arch}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            echo "Building ${output}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/${output}${ext}" .
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gitty_* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/gitty_* dist/SHA256SUMS
